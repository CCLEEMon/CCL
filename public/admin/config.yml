backend:
  name: github
  repo: CCLEEMon/CCL
  branch: main
  base_url: https://sveltia-cms-auth.leecc1531.workers.dev
  
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: pages
    label: 页面
    folder: src/pages
    create: true
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 内容, name: body, widget: markdown }